name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DesktopOnly: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format whitespace --folder --verify-no-changes

      - name: Test
        run: dotnet test tests/Nova.Avalonia.Foldable.Tests --configuration Release

  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Workload set 10.0.402.1 has the iOS 27.1 workload; later sets drop the net10.0-ios27.1 target.
      - name: Install workloads
        run: dotnet workload install ios android --version 10.0.402.1

      - name: Build library
        run: dotnet build src/Nova.Avalonia.Foldable --configuration Release

      - name: Pack NuGet packages
        run: ./build/pack-nuget.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Build samples
        run: |
          dotnet build samples/Nova.Avalonia.Foldable.Showcase/Nova.Avalonia.Foldable.Showcase.Desktop --configuration Release
          dotnet build samples/Nova.Avalonia.Foldable.Showcase/Nova.Avalonia.Foldable.Showcase.Android --configuration Release
          dotnet build samples/Nova.Avalonia.Foldable.Sample/Nova.Avalonia.Foldable.Sample.Android --configuration Release
