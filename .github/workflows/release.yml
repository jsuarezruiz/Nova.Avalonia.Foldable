name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

jobs:
  test:
    name: Check formatting and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DesktopOnly: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format whitespace --folder --verify-no-changes

      - name: Test
        run: dotnet test tests/Nova.Avalonia.Foldable.Tests --configuration Release

  release:
    name: Publish NuGet packages and create release
    needs: test
    # The library targets net10.0-ios27.1 and net10.0-android, so packing needs macOS with both workloads.
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      # Creates and publishes the GitHub Release.
      contents: write
      # Lets NuGet/login exchange GitHub's OIDC token for a short-lived nuget.org key (Trusted Publishing).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE format, for example v1.0.0 or v1.1.0-preview.1." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi

          package_version="${GITHUB_REF_NAME#v}"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

          if [[ "$package_version" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Workload set 10.0.402.1 has the iOS 27.1 workload; later sets drop the net10.0-ios27.1 target.
      - name: Install workloads
        run: dotnet workload install ios android --version 10.0.402.1

      - name: Build samples
        run: |
          dotnet build samples/Nova.Avalonia.Foldable.Showcase/Nova.Avalonia.Foldable.Showcase.Desktop --configuration Release
          dotnet build samples/Nova.Avalonia.Foldable.Showcase/Nova.Avalonia.Foldable.Showcase.Android --configuration Release
          dotnet build samples/Nova.Avalonia.Foldable.Sample/Nova.Avalonia.Foldable.Sample.Android --configuration Release

      - name: Pack NuGet packages
        run: ./build/pack-nuget.sh "$PACKAGE_VERSION" artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Prepare GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release_is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "GitHub Release $GITHUB_REF_NAME is already published." >&2
              exit 1
            fi

            gh release upload "$GITHUB_REF_NAME" \
              artifacts/packages/*.nupkg \
              artifacts/packages/*.snupkg \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              artifacts/packages/*.nupkg \
              artifacts/packages/*.snupkg \
              --draft \
              --prerelease="$IS_PRERELEASE" \
              --verify-tag \
              --generate-notes \
              --fail-on-no-commits \
              --title "Nova Avalonia Foldable $GITHUB_REF_NAME"
          fi

      # Trusted Publishing: nuget.org's policy for this repository and release.yml issues a key that lasts one hour,
      # so it's requested right before the push.
      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jsuarezruiz

      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "NuGet login returned no API key. Check the Trusted Publishing policy on nuget.org." >&2
            exit 1
          fi

          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
